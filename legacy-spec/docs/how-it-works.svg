<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#555"/></marker>
  </defs>
  <rect width="900" height="420" fill="#fff"/>

  <!-- 1 inventory -->
  <rect x="20" y="30" width="180" height="110" rx="8" fill="#f4f6f8" stroke="#9aa4ad"/>
  <text x="110" y="52" text-anchor="middle" font-weight="600">1 · inventory</text>
  <text x="32" y="76" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#333">
    <tspan x="32" dy="0">billing/calc.prg   1 210</tspan>
    <tspan x="32" dy="15">billing/print.prg    640</tspan>
    <tspan x="32" dy="15">stock/*.prg        7 980</tspan>
    <tspan x="32" dy="15">reports/*.frx    (binary)</tspan>
  </text>

  <!-- 2 split -->
  <rect x="240" y="30" width="200" height="110" rx="8" fill="#f4f6f8" stroke="#9aa4ad"/>
  <text x="340" y="52" text-anchor="middle" font-weight="600">2 · split ≤ 4 000 lines</text>
  <text x="252" y="76" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#333">
    <tspan x="252" dy="0">billing          1 850  pending</tspan>
    <tspan x="252" dy="15">stock/in         3 900  pending</tspan>
    <tspan x="252" dy="15">stock/out        4 080  pending</tspan>
    <tspan x="252" dy="15">vendor/lib           –  skipped</tspan>
  </text>
  <text x="340" y="158" text-anchor="middle" font-size="11" fill="#555">you confirm, merge, skip</text>

  <line x1="200" y1="85" x2="240" y2="85" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- 3 loop -->
  <rect x="480" y="20" width="400" height="230" rx="10" fill="#fff8e8" stroke="#d9a400"/>
  <text x="680" y="44" text-anchor="middle" font-weight="600">3 · loop, one unit per iteration</text>

  <rect x="500" y="60" width="150" height="34" rx="6" fill="#fff" stroke="#888"/>
  <text x="575" y="82" text-anchor="middle">read progress.tsv</text>

  <rect x="500" y="110" width="150" height="34" rx="6" fill="#fff" stroke="#888"/>
  <text x="575" y="132" text-anchor="middle">read unit files</text>

  <rect x="500" y="160" width="150" height="34" rx="6" fill="#fff" stroke="#888"/>
  <text x="575" y="182" text-anchor="middle">write modules/unit.md</text>

  <rect x="700" y="60" width="160" height="34" rx="6" fill="#fff" stroke="#888"/>
  <text x="780" y="82" text-anchor="middle">update tables · glossary</text>

  <rect x="700" y="110" width="160" height="34" rx="6" fill="#fff" stroke="#888"/>
  <text x="780" y="132" text-anchor="middle">append open questions</text>

  <rect x="700" y="160" width="160" height="34" rx="6" fill="#fff" stroke="#888"/>
  <text x="780" y="182" text-anchor="middle">mark done → checkpoint</text>

  <line x1="575" y1="94" x2="575" y2="110" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="575" y1="144" x2="575" y2="160" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="650" y1="177" x2="700" y2="77" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="780" y1="94" x2="780" y2="110" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="780" y1="144" x2="780" y2="160" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M780,194 L780,225 L575,225 L575,60" fill="none" stroke="#d9a400" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <text x="680" y="240" text-anchor="middle" font-size="11" fill="#7a5c00">stop any time · a new session resumes from disk</text>

  <line x1="440" y1="85" x2="480" y2="85" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- module excerpt -->
  <rect x="20" y="200" width="420" height="200" rx="8" fill="#f4f6f8" stroke="#9aa4ad"/>
  <text x="32" y="222" font-weight="600">spec/modules/billing.md</text>
  <text x="32" y="246" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#333">
    <tspan x="32" dy="0">## Rules</tspan>
    <tspan x="32" dy="16">- R1. Discount capped at 15% unless client</tspan>
    <tspan x="32" dy="14">      type = "H"            — calc.prg:212</tspan>
    <tspan x="32" dy="16">- R2. Invoice number resets each fiscal year</tspan>
    <tspan x="32" dy="14">                            — calc.prg:88</tspan>
    <tspan x="32" dy="16">## Inputs and outputs</tspan>
    <tspan x="32" dy="14">- FACT (insert), CLIENT (read)  — calc.prg:140</tspan>
    <tspan x="32" dy="16">## Open questions</tspan>
    <tspan x="32" dy="14">- Q. What is client type "H"?  — calc.prg:212</tspan>
  </text>

  <!-- 4 assemble -->
  <rect x="480" y="280" width="400" height="120" rx="8" fill="#eef7ee" stroke="#5c9c5c"/>
  <text x="680" y="302" text-anchor="middle" font-weight="600">4 · assemble</text>
  <text x="500" y="326" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#333">
    <tspan x="500" dy="0">index.md          tree map, one line per unit</tspan>
    <tspan x="500" dy="15">overview.md       purpose · actors · flows</tspan>
    <tspan x="500" dy="15">data-model/erd.md mermaid, inferred FKs flagged</tspan>
    <tspan x="500" dy="15">open-questions.md grouped by unit, for the owner</tspan>
  </text>
  <line x1="680" y1="250" x2="680" y2="280" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
</svg>
