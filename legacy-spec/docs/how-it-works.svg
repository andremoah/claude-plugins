<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="600" viewBox="0 0 1120 600" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5">
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#c9d1d9"/></marker>
    <marker id="arb" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#d29922"/></marker>
  </defs>
  <rect width="1120" height="600" fill="#0d1117"/>

  <!-- title -->
  <text x="20" y="32" font-size="21" font-weight="700" fill="#e6edf3">legacy-spec · undocumented source → validatable spec</text>
  <text x="20" y="54" font-size="12.5" fill="#8b949e">one context-sized unit per iteration · all state on disk · every claim cites path:line or table.column</text>

  <!-- column labels -->
  <text x="20"  y="92" font-size="11" font-weight="700" fill="#8b949e" letter-spacing="1">INPUTS</text>
  <text x="250" y="92" font-size="11" font-weight="700" fill="#8b949e" letter-spacing="1">PREPARE</text>
  <text x="470" y="92" font-size="11" font-weight="700" fill="#8b949e" letter-spacing="1">LOOP · ONE UNIT AT A TIME</text>
  <text x="860" y="92" font-size="11" font-weight="700" fill="#8b949e" letter-spacing="1">SPEC/ ON DISK</text>

  <!-- INPUTS -->
  <g>
    <rect x="20" y="104" width="200" height="62" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="32" y="126" font-weight="700" fill="#e6edf3">Source tree</text>
    <text x="32" y="144" fill="#c9d1d9">any language · any age</text>
    <text x="32" y="158" fill="#c9d1d9">read by the model, not parsed</text>

    <rect x="20" y="178" width="200" height="62" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="32" y="200" font-weight="700" fill="#e6edf3">Schema dump</text>
    <text x="32" y="218" fill="#c9d1d9">DDL · information_schema · ORM</text>
    <text x="32" y="232" fill="#c9d1d9">text only, no driver, no credentials</text>

    <rect x="20" y="252" width="200" height="62" rx="6" fill="#161b22" stroke="#30363d" stroke-dasharray="4 3"/>
    <text x="32" y="274" font-weight="700" fill="#e6edf3">Runtime samples</text>
    <text x="32" y="292" fill="#c9d1d9">logs · exported reports</text>
    <text x="32" y="306" fill="#8b949e">optional</text>

    <path d="M220,135 L236,135 L236,209 L250,209" fill="none" stroke="#c9d1d9" stroke-width="1.4" marker-end="url(#ar)"/>
    <path d="M220,209 L250,209" fill="none" stroke="#c9d1d9" stroke-width="1.4"/>
    <path d="M220,283 L236,283 L236,209" fill="none" stroke="#c9d1d9" stroke-width="1.4"/>
  </g>

  <!-- PREPARE -->
  <g>
    <rect x="250" y="104" width="200" height="210" rx="8" fill="#161b22" stroke="#1f6feb"/>
    <text x="262" y="128" font-weight="700" fill="#e6edf3">Inventory &amp; split</text>
    <text x="262" y="150" fill="#c9d1d9">• inventory.sh: path, lines,</text>
    <text x="274" y="165" fill="#c9d1d9">kind (text / data / binary)</text>
    <text x="262" y="186" fill="#c9d1d9">• plan.sh: group into units</text>
    <text x="274" y="201" fill="#c9d1d9">≤ N lines, descend when too big</text>
    <text x="262" y="222" fill="#c9d1d9">• you confirm: merge, cut,</text>
    <text x="274" y="237" fill="#c9d1d9">skip vendored / generated</text>
    <rect x="262" y="256" width="176" height="44" rx="5" fill="#0d1117" stroke="#388bfd"/>
    <text x="270" y="274" font-family="ui-monospace, Menlo, monospace" font-size="10.5" fill="#58a6ff">_state/progress.tsv</text>
    <text x="270" y="290" font-family="ui-monospace, Menlo, monospace" font-size="10.5" fill="#58a6ff">unit · status · lines · notes</text>
    <path d="M450,209 L470,209" fill="none" stroke="#c9d1d9" stroke-width="1.4" marker-end="url(#ar)"/>
  </g>

  <!-- LOOP -->
  <g>
    <rect x="470" y="104" width="370" height="330" rx="10" fill="#161b22" stroke="#d29922" stroke-dasharray="6 4"/>

    <rect x="490" y="124" width="150" height="46" rx="6" fill="#0d1117" stroke="#30363d"/>
    <text x="565" y="143" text-anchor="middle" font-weight="700" fill="#e6edf3">pick next pending</text>
    <text x="565" y="159" text-anchor="middle" fill="#8b949e" font-size="11">from progress.tsv</text>

    <rect x="670" y="124" width="150" height="46" rx="6" fill="#0d1117" stroke="#30363d"/>
    <text x="745" y="143" text-anchor="middle" font-weight="700" fill="#e6edf3">read the unit</text>
    <text x="745" y="159" text-anchor="middle" fill="#8b949e" font-size="11">oversize → in sections</text>

    <rect x="670" y="206" width="150" height="46" rx="6" fill="#0d1117" stroke="#30363d"/>
    <text x="745" y="225" text-anchor="middle" font-weight="700" fill="#e6edf3">write modules/unit.md</text>
    <text x="745" y="241" text-anchor="middle" fill="#8b949e" font-size="11">rules cited path:line</text>

    <rect x="670" y="288" width="150" height="46" rx="6" fill="#0d1117" stroke="#30363d"/>
    <text x="745" y="307" text-anchor="middle" font-weight="700" fill="#e6edf3">update shared files</text>
    <text x="745" y="323" text-anchor="middle" fill="#8b949e" font-size="11">tables · glossary · questions</text>

    <rect x="490" y="288" width="150" height="46" rx="6" fill="#0d1117" stroke="#30363d"/>
    <text x="565" y="307" text-anchor="middle" font-weight="700" fill="#e6edf3">mark done</text>
    <text x="565" y="323" text-anchor="middle" fill="#8b949e" font-size="11">checkpoint written</text>

    <path d="M640,147 L670,147" fill="none" stroke="#c9d1d9" stroke-width="1.4" marker-end="url(#ar)"/>
    <path d="M745,170 L745,206" fill="none" stroke="#c9d1d9" stroke-width="1.4" marker-end="url(#ar)"/>
    <path d="M745,252 L745,288" fill="none" stroke="#c9d1d9" stroke-width="1.4" marker-end="url(#ar)"/>
    <path d="M670,311 L640,311" fill="none" stroke="#c9d1d9" stroke-width="1.4" marker-end="url(#ar)"/>
    <path d="M565,288 L565,170" fill="none" stroke="#d29922" stroke-width="1.6" marker-end="url(#arb)"/>
    <text x="575" y="232" fill="#d29922" font-size="11" font-style="italic">repeat</text>
    <text x="575" y="246" fill="#d29922" font-size="11" font-style="italic">while pending</text>

    <!-- citation rule box -->
    <rect x="490" y="352" width="330" height="66" rx="6" fill="#1f1a0b" stroke="#d29922"/>
    <text x="502" y="372" font-weight="700" fill="#e3b341">Rule: citation or question</text>
    <text x="502" y="389" fill="#e3b341" font-size="11.5">read in the code → rule with path:line</text>
    <text x="502" y="405" fill="#e3b341" font-size="11.5">inferred, not read → open question, with the line that raised it</text>

    <text x="655" y="452" text-anchor="middle" fill="#d29922" font-size="11.5">stop after any unit · a new session resumes from disk</text>
  </g>

  <!-- SPEC -->
  <g>
    <rect x="860" y="104" width="240" height="330" rx="8" fill="#161b22" stroke="#3fb950"/>
    <text x="872" y="128" font-weight="700" fill="#e6edf3">spec/</text>
    <text x="872" y="146" fill="#8b949e" font-size="11">in your repo, versioned with it</text>
    <g font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#7ee787">
      <text x="872" y="172">modules/&lt;unit&gt;.md</text>
      <text x="872" y="190">data-model/tables.md · erd.md</text>
      <text x="872" y="208">interfaces/*.md</text>
      <text x="872" y="226">glossary.md</text>
      <text x="872" y="244">open-questions.md</text>
      <text x="872" y="262">index.md · overview.md</text>
      <text x="872" y="280">_state/</text>
    </g>
    <text x="872" y="306" fill="#c9d1d9" font-size="11.5">written incrementally by the loop;</text>
    <text x="872" y="321" fill="#c9d1d9" font-size="11.5">index, overview and ERD built</text>
    <text x="872" y="336" fill="#c9d1d9" font-size="11.5">by assemble at the end.</text>

    <rect x="872" y="356" width="216" height="62" rx="6" fill="#0d1117" stroke="#238636"/>
    <text x="884" y="376" font-weight="700" fill="#e6edf3">Domain owner</text>
    <text x="884" y="392" fill="#c9d1d9" font-size="11.5">answers open-questions.md,</text>
    <text x="884" y="407" fill="#c9d1d9" font-size="11.5">corrects terms in glossary.md</text>

    <path d="M840,269 L860,269" fill="none" stroke="#c9d1d9" stroke-width="1.4" marker-end="url(#ar)"/>
    <path d="M872,387 L852,387 L852,311 L820,311" fill="none" stroke="#d29922" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arb)"/>
    <text x="846" y="470" text-anchor="end" fill="#d29922" font-size="11" font-style="italic">answers go back into the unit spec</text>
  </g>

  <!-- step strip -->
  <rect x="0" y="492" width="1120" height="108" fill="#161b22"/>
  <text x="20" y="516" font-size="11" font-weight="700" fill="#8b949e" letter-spacing="1">COMMANDS, IN ORDER</text>
  <g font-size="12.5" fill="#e6edf3">
    <circle cx="32" cy="546" r="10" fill="#1f6feb"/><text x="32" y="550" text-anchor="middle" fill="#e6edf3" font-size="11" font-weight="700">1</text>
    <text x="50" y="550"><tspan font-family="ui-monospace, Menlo, monospace" font-size="11.5">init</tspan> inventory + split</text>
    <circle cx="232" cy="546" r="10" fill="#1f6feb"/><text x="232" y="550" text-anchor="middle" fill="#e6edf3" font-size="11" font-weight="700">2</text>
    <text x="250" y="550"><tspan font-family="ui-monospace, Menlo, monospace" font-size="11.5">next</tspan> / <tspan font-family="ui-monospace, Menlo, monospace" font-size="11.5">run</tspan> the loop</text>
    <circle cx="432" cy="546" r="10" fill="#1f6feb"/><text x="432" y="550" text-anchor="middle" fill="#e6edf3" font-size="11" font-weight="700">3</text>
    <text x="450" y="550"><tspan font-family="ui-monospace, Menlo, monospace" font-size="11.5">data</tspan> schema dump</text>
    <circle cx="622" cy="546" r="10" fill="#1f6feb"/><text x="622" y="550" text-anchor="middle" fill="#e6edf3" font-size="11" font-weight="700">4</text>
    <text x="640" y="550"><tspan font-family="ui-monospace, Menlo, monospace" font-size="11.5">assemble</tspan> index · overview · ERD</text>
    <circle cx="872" cy="546" r="10" fill="#d29922"/><text x="872" y="550" text-anchor="middle" fill="#e6edf3" font-size="11" font-weight="700">5</text>
    <text x="890" y="550"><tspan font-family="ui-monospace, Menlo, monospace" font-size="11.5">questions</tspan> → owner validates</text>
  </g>
  <text x="20" y="582" fill="#8b949e" font-size="11.5">Steps 2 and 3 can run in any order and across many sessions. Step 5 feeds corrections back into the unit specs until nothing is open.</text>
</svg>
