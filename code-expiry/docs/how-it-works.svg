<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b949e"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3fb950"/>
    </marker>
  </defs>
  <rect width="1200" height="460" rx="12" fill="#0d1117"/>

  <!-- step numbers -->
  <g font-size="12" font-weight="700" fill="#0d1117">
    <circle cx="60" cy="88" r="12" fill="#58a6ff"/><text x="60" y="92.5" text-anchor="middle">1</text>
    <circle cx="360" cy="88" r="12" fill="#58a6ff"/><text x="360" y="92.5" text-anchor="middle">2</text>
    <circle cx="660" cy="88" r="12" fill="#58a6ff"/><text x="660" y="92.5" text-anchor="middle">3</text>
    <circle cx="960" cy="88" r="12" fill="#58a6ff"/><text x="960" y="92.5" text-anchor="middle">4</text>
  </g>

  <!-- box 1: write -->
  <rect x="40" y="110" width="220" height="150" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="150" y="142" text-anchor="middle" fill="#e6edf3" font-size="17" font-weight="600">Claude writes temp code</text>
  <text x="150" y="170" text-anchor="middle" fill="#8b949e" font-size="13">a fallback, a shim, a flag,</text>
  <text x="150" y="188" text-anchor="middle" fill="#8b949e" font-size="13">"TODO remove after rollout"</text>
  <rect x="62" y="210" width="176" height="28" rx="6" fill="#0d1117" stroke="#30363d"/>
  <text x="150" y="229" text-anchor="middle" fill="#d29922" font-size="12" font-family="Menlo, Consolas, monospace">PostToolUse hook nudges</text>

  <!-- box 2: marker -->
  <rect x="340" y="110" width="220" height="150" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="450" y="142" text-anchor="middle" fill="#e6edf3" font-size="17" font-weight="600">Marker with a date</text>
  <rect x="356" y="158" width="188" height="48" rx="6" fill="#0d1117" stroke="#30363d"/>
  <text x="450" y="178" text-anchor="middle" fill="#7ee787" font-size="12" font-family="Menlo, Consolas, monospace">// EXPIRES: 2026-12-31</text>
  <text x="450" y="196" text-anchor="middle" fill="#8b949e" font-size="11" font-family="Menlo, Consolas, monospace">why + what must be true</text>
  <text x="450" y="236" text-anchor="middle" fill="#8b949e" font-size="13">any language, any comment style</text>

  <!-- box 3: session start -->
  <rect x="640" y="110" width="220" height="150" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="750" y="142" text-anchor="middle" fill="#e6edf3" font-size="17" font-weight="600">Shown when due</text>
  <text x="750" y="170" text-anchor="middle" fill="#8b949e" font-size="13">every session start lists</text>
  <text x="750" y="188" text-anchor="middle" fill="#8b949e" font-size="13"><tspan fill="#f85149">overdue</tspan> and <tspan fill="#d29922">due within 14 days</tspan></text>
  <rect x="662" y="210" width="176" height="28" rx="6" fill="#0d1117" stroke="#30363d"/>
  <text x="750" y="229" text-anchor="middle" fill="#d29922" font-size="12" font-family="Menlo, Consolas, monospace">SessionStart hook</text>

  <!-- box 4: reap -->
  <rect x="940" y="110" width="220" height="150" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="1050" y="142" text-anchor="middle" fill="#e6edf3" font-size="17" font-weight="600">Removed on command</text>
  <text x="1050" y="170" text-anchor="middle" fill="#8b949e" font-size="13">reaper agent reads the block,</text>
  <text x="1050" y="188" text-anchor="middle" fill="#8b949e" font-size="13">checks references, proposes a diff</text>
  <rect x="962" y="210" width="176" height="28" rx="6" fill="#0d1117" stroke="#30363d"/>
  <text x="1050" y="229" text-anchor="middle" fill="#7ee787" font-size="12" font-family="Menlo, Consolas, monospace">/expiry reap</text>

  <!-- main arrows -->
  <line x1="262" y1="185" x2="336" y2="185" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="562" y1="185" x2="636" y2="185" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="862" y1="185" x2="936" y2="185" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- human-in-the-loop badges on arrows -->
  <g font-size="11" fill="#e6edf3">
    <rect x="246" y="150" width="108" height="20" rx="10" fill="#1f6feb"/>
    <text x="300" y="164" text-anchor="middle">you pick the date</text>
    <rect x="862" y="150" width="76" height="20" rx="10" fill="#1f6feb"/>
    <text x="900" y="164" text-anchor="middle">you approve</text>
  </g>

  <!-- audit path (existing repo) -->
  <rect x="40" y="320" width="220" height="90" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="150" y="350" text-anchor="middle" fill="#e6edf3" font-size="16" font-weight="600">Existing repo?</text>
  <text x="150" y="372" text-anchor="middle" fill="#8b949e" font-size="13">find undated temp code, oldest first,</text>
  <text x="150" y="390" text-anchor="middle" fill="#8b949e" font-size="13">triage it with you in batches</text>
  <rect x="300" y="352" width="110" height="26" rx="6" fill="#0d1117" stroke="#30363d"/>
  <text x="355" y="370" text-anchor="middle" fill="#7ee787" font-size="12" font-family="Menlo, Consolas, monospace">/expiry audit</text>
  <path d="M 262 365 L 298 365" stroke="#3fb950" stroke-width="2" fill="none"/>
  <path d="M 412 365 L 450 365 L 450 264" stroke="#3fb950" stroke-width="2" fill="none" marker-end="url(#arrow-green)"/>

  <!-- CI path -->
  <text x="762" y="290" text-anchor="start" fill="#8b949e" font-size="12">also usable in CI</text>
  <rect x="640" y="312" width="220" height="30" rx="6" fill="#0d1117" stroke="#30363d"/>
  <text x="750" y="332" text-anchor="middle" fill="#c9d1d9" font-size="12" font-family="Menlo, Consolas, monospace">scan.sh --fail-on-overdue</text>
  <path d="M 750 264 L 750 308" stroke="#8b949e" stroke-width="2" stroke-dasharray="4 4" fill="none" marker-end="url(#arrow)"/>

  <!-- footer -->
  <text x="600" y="440" text-anchor="middle" fill="#8b949e" font-size="13">Nothing is written or deleted without you seeing it first.</text>

  <!-- title -->
  <text x="40" y="52" fill="#e6edf3" font-size="22" font-weight="700">code-expiry</text>
  <text x="170" y="52" fill="#8b949e" font-size="16">temporary code with an expiry date</text>
</svg>
