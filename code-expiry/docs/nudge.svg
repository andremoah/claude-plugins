  <text x="460" y="21" text-anchor="middle" fill="#8b949e" font-size="12">claude — Claude writes a fallback</text>
  <text x="20" y="58" fill="#7ee787">● Write</text><text x="90" y="58" fill="#8b949e">src/Api/Clients/LegacyPricingClient.ts</text>
